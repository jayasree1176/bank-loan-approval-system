{% extends 'base.html' %}

{% block title %}Error {{ error_code or 404 }}{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-bank p-5 mx-auto" style="max-width: 550px;">
        <div class="metric-icon icon-red mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h1 class="display-3 fw-bold text-danger mb-2">{{ error_code or 404 }}</h1>
        <h4 class="fw-bold mb-3">Oops! Page or Resource Error</h4>
        <p class="text-muted mb-4">{{ message or "The requested resource could not be found." }}</p>
        <a href="{{ url_for('index') }}" class="btn btn-bank-primary px-4 shadow-sm">
            <i class="fa-solid fa-house me-2"></i> Return to Safety
        </a>
    </div>
</div>
{% endblock %}
